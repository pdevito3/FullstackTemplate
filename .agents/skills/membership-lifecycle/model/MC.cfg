\* The safety check at the widest bounds. Live.cfg checks the liveness rules. Run all with ../check.sh.
CONSTANTS
    Claims <- FullClaims
    SubOf <- FullSub
    InvOf <- FullInv
    Invs <- FullInvs
    Revokes <- FullRevokes
    Initiators <- FullInitiators
    InitiateRole <- InitiateRoles
    DeleteTenantReq = TRUE
    Admins <- FullAdmins
    Changes <- FullChanges
    ChangeSub <- ChangeSubs
    ChangeKind <- ChangeKinds
    MaxRuns = 3
    InviteVersionCheck = TRUE
    ClaimTakesLock = TRUE
    LastManagerRule = TRUE
    ManagerTakesLock = TRUE
    FirstUserRule = TRUE
SPECIFICATION Spec
INVARIANTS
    OneLiveUserPerSub
    LiveUserInLiveTenant
    OneOutcomePerInvite
    ClaimedMeansOneUser
    RevokeBeatsClaim
    RunsBounded
    TenantKeepsAManager
