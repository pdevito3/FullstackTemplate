\* A config small enough for the /statechart chart: one upload, one worker, one attempt, no crash.
\* Expected: no error.
CONSTANTS
    Atts = {a1}
    Runners = {r1}
    MaxAttempts = 1
    MaxCrashes = 0
    Cleanup = FALSE
    CleanupFails = FALSE
    LateCommit = FALSE
    Grace = "add"
    SoftDeletedNames = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLiveRowWithoutObject NoLiveRowInDeletedTenant
