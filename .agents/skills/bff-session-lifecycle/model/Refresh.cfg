\* The refresh lock across two BFF instances: requests 1 and 2 on instance 1 share one in-process refresh, and
\* request 3 runs on instance 2. One login, /bff/logout, expiry renewals, expiry and cleanup, and one crash.
\* Safety only. RefreshLiveness.cfg checks that each refresh ends.
SPECIFICATION Spec
CONSTANTS
    NReqs = 3
    Logins = 1
    MaxTokens = 3
    MaxCrashes = 1
    MaxDeliveries = 0
    WithExpiry = TRUE
    WithRenewal = TRUE
    WithLogout = TRUE
INVARIANTS
    TypeOK
    NoUnexcusedOrphanToken
    LogoutEndsSession
    NoTokenWriteConflict
    NoStaleInFlightEntry
    NoStaleLock
