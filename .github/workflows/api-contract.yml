name: API contract

# Fails when the committed OpenAPI document or the generated frontend contract is not current.
# To correct a failure, build the Server, run `pnpm generate:api` in frontend/, and commit the result.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-contract:
    runs-on: ubuntu-latest
    env:
      KUBB_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the Server (writes the OpenAPI document)
        run: dotnet build FullstackTemplate.Server/FullstackTemplate.Server.csproj --configuration Debug

      - name: Install the frontend packages
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate the API contract
        working-directory: frontend
        run: pnpm generate:api

      - name: Fail on a contract diff
        run: |
          git add --intent-to-add --all
          git diff --exit-code --stat -- FullstackTemplate.Server/openapi frontend/src/api/generated
