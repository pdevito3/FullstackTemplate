name: CI

# The api-contract job fails when the committed OpenAPI document or the generated frontend contract is not current.
# To correct a failure, build the Server, run `pnpm generate:api` in frontend/, and commit the result.
# The job also builds, lints, and tests the frontend against the contract, and runs the functional suite of the frontend. The test job runs the .NET tests.
# The line-endings job fails when a tracked text file has a CR. .gitattributes stores each text file with LF.
# The grpc-contract job lints the .proto files and fails on a breaking change against main. See buf.yaml.
# example:start
# The without-examples job runs scripts/remove-examples.cs, then builds and tests the app that is left. See docs/examples.md.
# example:end
# The BFF jobs (bff-tests, e2e) run only when the changes job finds a BFF change, and on workflow_dispatch.
# There is no nightly run. See section 7 of docs/specs/home-rolled-bff.md.
# init:start - scripts/init.cs deletes these lines and conformance.yml when it renames the app
# conformance.yml runs the OpenID conformance suite.
# init:end

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The pnpm version comes from packageManager in frontend/package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The build and the generate step write the files again for each supported version.
      # The files of a removed version then show in the diff as deleted files.
      - name: Delete the committed contract files
        run: rm -rf FullstackTemplate.Server/openapi/*.json frontend/src/api/generated*

      - name: Build the Server (writes the OpenAPI document)
        run: dotnet build FullstackTemplate.Server/FullstackTemplate.Server.csproj --configuration Debug

      - name: Install the frontend packages
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate the API contract
        working-directory: frontend
        run: pnpm generate:api

      - name: Fail on a contract diff
        run: |
          git add --intent-to-add --all
          git diff --exit-code --stat -- FullstackTemplate.Server/openapi ':(glob)frontend/src/api/generated*/**'

      - name: Build the frontend
        working-directory: frontend
        run: pnpm build

      # pnpm build writes the route tree, so a stale committed routeTree.gen.ts shows as a diff.
      - name: Fail on a stale route tree
        run: git diff --exit-code --stat -- frontend/src/routeTree.gen.ts

      - name: Lint the frontend
        working-directory: frontend
        run: pnpm lint

      # The component tests (*.test.tsx) run in a headless Chromium with Vitest browser mode.
      - uses: ./.github/actions/install-chromium

      - name: Test the frontend
        working-directory: frontend
        run: pnpm test

      # The functional suite: the SPA in a headless Chromium, with each call to the BFF mocked in the browser.
      - name: Run the functional tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload the functional test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-tests
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # example:start
  without-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Remove the examples
        run: dotnet run scripts/remove-examples.cs

      # The script changes only a clean tree, so the job commits the first run
      - name: Fail if a second run changes a file
        run: |
          git add --all
          git -c user.name=ci -c user.email=ci@localhost commit --quiet --message "Remove the examples"
          dotnet run scripts/remove-examples.cs
          git add --intent-to-add --all
          git diff --exit-code --stat

      - name: Fail on example code that the script left
        run: |
          if git ls-files | grep -E '(^|/)(Examples|examples|\(examples\))/'; then exit 1; fi
          # git grep exits with 1 when it finds nothing, 0 on a match, and a higher code on an error
          status=0
          git grep -n -I -i -E 'weather|forecast|filter-demo|components-showcase|get_tenant|list_tenants|update_tenant|workshop|(^|[^e])venue|example:(start|end)' \
            -- ':!scripts/remove-examples.cs' ':!docs/examples.md' ':!**/Migrations/*.Designer.cs' || status=$?
          [ "$status" -eq 1 ]

      # The frontend tests run first, because after the .NET tests on the same runner the Vitest browser can hang at its start
      - name: Lint the frontend
        working-directory: frontend
        run: pnpm lint

      - uses: ./.github/actions/install-chromium

      - name: Test the frontend
        working-directory: frontend
        run: pnpm test

      - name: Run the functional tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Build the solution
        run: dotnet build FullstackTemplate.slnx

      - name: Run the .NET tests
        run: dotnet test --solution FullstackTemplate.slnx --no-build
  # example:end

  line-endings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fail on a text file with a CR
        run: |
          if git grep --cached -I -l $'\r'; then
            echo "::error::The files above have CR characters. Run git add --renormalize . and commit the result."
            exit 1
          elif [ $? -ne 1 ]; then
            echo "::error::git grep failed."
            exit 2
          fi

  grpc-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # buf breaking reads the contract of main from the local clone
          fetch-depth: 0

      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.74.0
          setup_only: true

      - name: Lint the gRPC contract
        run: buf lint

      - name: Fail on a breaking change to the gRPC contract
        run: |
          if git ls-tree -r --name-only origin/main -- FullstackTemplate.Server/Domain | grep -q '\.proto$'; then
            buf breaking --against '.git#ref=refs/remotes/origin/main'
          else
            echo "main has no gRPC contract yet, so there is nothing to compare."
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The integration and functional tests start Postgres with Testcontainers on the runner's Docker.
      # The api-contract job checks the OpenAPI document, so this build does not write it again.
      # The bff-tests job runs the BFF tests, so this job skips them.
      - name: Run the tests
        run: dotnet test --solution FullstackTemplate.slnx -p:OpenApiGenerateDocuments=false -p:SkipBffTests=true

  # A path filter, not paths: on the trigger, so that a skipped BFF job still reports a status.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bff: ${{ steps.filter.outputs.bff }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            bff:
              - 'FullstackTemplate.Bff/**'
              - 'tests/FullstackTemplate.Bff.Tests/**'
              # The BFF tests compile this helper with a link
              - 'tests/FullstackTemplate.SharedTestHelpers/Utilities/PauseAtQuery.cs'
              # The BFF compiles this health check wrapper with a link
              - 'FullstackTemplate.Server/Resources/Extensions/CallerCancellationHealthCheck.cs'
              - 'FullstackTemplate.AppHost/**'
              # The token check of the Server, which the e2e tests call through the BFF
              - 'FullstackTemplate.Server/Resources/Entrypoints/**'
              - 'Directory.Packages.props'
              - 'Directory.Build.props'
              - 'global.json'
              - 'dotnet-tools.json'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/e2e/**'
              - 'frontend/playwright.stack.config.ts'
              # The SPA and the dev server proxy, which the e2e tests drive
              - 'frontend/vite.config.ts'
              - 'frontend/src/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/e2e.yml'
              - '.github/actions/install-chromium/**'

  bff-tests:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.bff == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The integration tests start Postgres with Testcontainers. The refresh lock tests run two BFF hosts on it.
      # Without --results-directory, Microsoft.Testing.Platform writes the reports under bin/ of the test project.
      - name: Run the BFF tests
        run: >-
          dotnet test --project tests/FullstackTemplate.Bff.Tests/FullstackTemplate.Bff.Tests.csproj
          --report-trx --results-directory "$GITHUB_WORKSPACE/TestResults"

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bff-tests
          path: TestResults/
          retention-days: 30

  e2e:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.bff == 'true'
    uses: ./.github/workflows/e2e.yml
