\* The worst case of F1: a put lands under a deleted tenant after its DeleteTenantObjects job listed
\* the prefix. The witness NoObjectLeftInDeletedTenant breaks, so TLC shows the path. On the same scope, OrphansGo
\* holds: the sweep deletes the object. Expected: NoObjectLeftInDeletedTenant breaks, and nothing else.
CONSTANTS
    Atts = {a1}
    Runners = {r1}
    MaxAttempts = 1
    MaxCrashes = 1
    Cleanup = FALSE
    CleanupFails = FALSE
    LateCommit = FALSE
    Grace = "add"
    SoftDeletedNames = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoObjectLeftInDeletedTenant
PROPERTIES OrphansGo
