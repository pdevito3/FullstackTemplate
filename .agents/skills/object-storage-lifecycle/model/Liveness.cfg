\* The liveness gate: each job, add, COMMIT, and tenant delete ends. Smaller than the safety gate,
\* because TLC checks liveness on the whole graph. Expected: no error.
CONSTANTS
    Atts = {a1}
    Runners = {r1, r2}
    MaxAttempts = 2
    MaxCrashes = 1
    CleanupFails = TRUE
    LateCommit = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTIES RequestsSettle AddsSettle CommitsSettle TenantDeleteSettles
