\* The liveness gate: each job, add, COMMIT, and tenant delete ends, and the sweep deletes each object that no
\* live row names. Smaller than the safety gate, because TLC checks liveness on the whole graph. Expected: no error.
CONSTANTS
    Atts = {a1}
    Runners = {r1, r2}
    MaxAttempts = 2
    MaxCrashes = 1
    Cleanup = FALSE
    CleanupFails = FALSE
    LateCommit = TRUE
    Grace = "add"
    SoftDeletedNames = FALSE
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTIES RequestsSettle AddsSettle CommitsSettle TenantDeleteSettles OrphansGo
