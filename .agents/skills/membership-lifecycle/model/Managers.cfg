\* The manager paths of UM-4 with no invites: the demote, the permission removal, and the delete of the two admins, the tenant delete, and a start of a tenant with the User role. Small, so it also checks the liveness rules.
CONSTANTS
    Claims <- NoClaims
    SubOf <- FullSub
    InvOf <- FullInv
    Invs <- NoInvs
    Revokes <- NoInvs
    Initiators <- ManagerInitiators
    InitiateRole <- InitiateRoles
    DeleteTenantReq = TRUE
    Admins <- FullAdmins
    Changes <- ManagerChanges
    ChangeSub <- ChangeSubs
    ChangeKind <- ChangeKinds
    MaxRuns = 3
    InviteVersionCheck = TRUE
    ClaimTakesLock = TRUE
    LastManagerRule = TRUE
    ManagerTakesLock = TRUE
    FirstUserRule = TRUE
SPECIFICATION Spec
INVARIANTS
    OneLiveUserPerSub
    LiveUserInLiveTenant
    OneOutcomePerInvite
    ClaimedMeansOneUser
    RevokeBeatsClaim
    RunsBounded
    TenantKeepsAManager
PROPERTIES
    EveryRequestEnds
    PendingHasWayOut
