\* Back-channel logout against login, a refresh, a new login with the old cookie, and one crash.
\* The jti insert and the deletes commit in one transaction, as in BackChannelLogoutEndpoint.
SPECIFICATION Spec
CONSTANTS
    NReqs = 1
    Logins = 2
    MaxTokens = 3
    MaxCrashes = 1
    MaxDeliveries = 2
    WithExpiry = FALSE
    WithRenewal = FALSE
    WithLogout = FALSE
INVARIANTS
    TypeOK
    NoUnexcusedOrphanToken
    BackChannelLogoutEndsSessions
    ReplayRefusedOnlyWhenEnded
    NoTokenWriteConflict
    NoStaleInFlightEntry
    NoStaleLock
PROPERTIES
    RefreshEnds
    BackChannelEnds
