\* Finding F1, the crash path: the cleanup of a failed add always works here, so each orphan
\* comes from a process that died between the put and the end of the add.
\* Expected: EveryObjectAccounted and NoObjectLeftInDeletedTenant break.
CONSTANTS
    Atts = {a1}
    Runners = {r1}
    MaxAttempts = 1
    MaxCrashes = 1
    CleanupFails = FALSE
    LateCommit = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK EveryObjectAccounted NoObjectLeftInDeletedTenant
