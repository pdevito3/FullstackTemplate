\* The safety check at the widest bounds. Live.cfg checks the liveness rules. Run all with ../check.sh.
CONSTANTS
    Claims <- FullClaims
    SubOf <- FullSub
    InvOf <- FullInv
    Invs <- FullInvs
    Revokes <- FullRevokes
    Initiators <- FullInitiators
    DeleteTenantReq = TRUE
    DeleteUserReq = TRUE
    MaxRuns = 3
    InviteVersionCheck = TRUE
    ClaimTakesLock = TRUE
SPECIFICATION Spec
INVARIANTS
    OneLiveUserPerSub
    LiveUserInLiveTenant
    OneOutcomePerInvite
    ClaimedMeansOneUser
    RevokeBeatsClaim
    RunsBounded
