name: API contract

# Fails when the committed OpenAPI document or the generated frontend contract is not current.
# To correct a failure, build the Server, run `pnpm generate:api` in frontend/, and commit the result.
# Also builds and lints the frontend against the contract, and runs the .NET tests.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    env:
      KUBB_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the Server (writes the OpenAPI document)
        run: dotnet build FullstackTemplate.Server/FullstackTemplate.Server.csproj --configuration Debug

      - name: Install the frontend packages
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate the API contract
        working-directory: frontend
        run: pnpm generate:api

      - name: Fail on a contract diff
        run: |
          git add --intent-to-add --all
          git diff --exit-code --stat -- FullstackTemplate.Server/openapi frontend/src/api/generated

      - name: Build the frontend
        working-directory: frontend
        run: pnpm build

      - name: Lint the frontend
        working-directory: frontend
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # The integration and functional tests start Postgres with Testcontainers on the runner's Docker.
      - name: Run the tests
        run: dotnet test --solution FullstackTemplate.slnx
