\* The liveness check: the bounds of MC.cfg with only the race of the two admins and MaxRuns 2, so the temporal check stays short.
CONSTANTS
    Claims <- FullClaims
    SubOf <- FullSub
    InvOf <- FullInv
    Invs <- FullInvs
    Revokes <- FullRevokes
    Initiators <- FullInitiators
    DeleteTenantReq = TRUE
    Admins <- FullAdmins
    Changes <- RaceChanges
    ChangeSub <- FullChangeSub
    ChangeKind <- FullChangeKind
    MaxRuns = 2
    InviteVersionCheck = TRUE
    ClaimTakesLock = TRUE
    LastAdminRule = TRUE
    AdminTakesLock = TRUE
SPECIFICATION Spec
INVARIANTS
    OneLiveUserPerSub
    LiveUserInLiveTenant
    OneOutcomePerInvite
    ClaimedMeansOneUser
    RevokeBeatsClaim
    RunsBounded
    TenantKeepsAnAdmin
PROPERTIES
    EveryRequestEnds
    PendingHasWayOut
