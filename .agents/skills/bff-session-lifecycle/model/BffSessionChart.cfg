\* A small passing model for the /statechart chart: one browser, one login, one API call that refreshes on
\* instance 2, and one crash. No logout, no back-channel logout, no expiry renewal, no expiry.
SPECIFICATION Spec
CONSTANTS
    NReqs = 1
    Logins = 1
    MaxTokens = 2
    MaxCrashes = 1
    MaxDeliveries = 0
    WithExpiry = FALSE
    WithRenewal = FALSE
    WithLogout = FALSE
INVARIANTS
    TypeOK
    NoUnexcusedOrphanToken
    LogoutEndsSession
    BackChannelLogoutEndsSessions
    ReplayRefusedOnlyWhenEnded
    NoTokenWriteConflict
    NoStaleInFlightEntry
    NoStaleLock
PROPERTIES
    RefreshEnds
    BackChannelEnds
