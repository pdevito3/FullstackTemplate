\* A sweep that keeps the object of a soft-deleted row. The object of a deleted file whose delete job
\* is dead stays. Expected: OrphansGo breaks (liveness).
CONSTANTS
    Atts = {a1}
    Runners = {r1}
    MaxAttempts = 1
    MaxCrashes = 0
    Cleanup = FALSE
    CleanupFails = FALSE
    LateCommit = FALSE
    Grace = "add"
    SoftDeletedNames = TRUE
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTIES OrphansGo
