\* Every refresh ends: requests 1 and 2 on instance 1 share one in-process refresh, request 3 runs on
\* instance 2, and one instance can crash. Smaller than Refresh.cfg, because TLC checks liveness slowly.
SPECIFICATION Spec
CONSTANTS
    NReqs = 3
    Logins = 1
    MaxTokens = 2
    MaxCrashes = 1
    MaxDeliveries = 0
    WithExpiry = FALSE
    WithRenewal = FALSE
    WithLogout = FALSE
    LoginLock = TRUE
    LoginDeadline = TRUE
INVARIANTS
    TypeOK
    NoUnexcusedOrphanToken
    LogoutEndsSession
    NoTokenWriteConflict
    NoStaleInFlightEntry
    NoStaleLock
PROPERTIES
    RefreshEnds
    LoginEnds
