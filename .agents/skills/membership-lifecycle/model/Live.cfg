\* The liveness check: the bounds of MC.cfg with only the race of the two admins and MaxRuns 2, so the temporal check stays short.
CONSTANTS
    Claims <- FullClaims
    SubOf <- FullSub
    InvOf <- FullInv
    Invs <- FullInvs
    Revokes <- FullRevokes
    Initiators <- FullInitiators
    InitiateRole <- InitiateRoles
    DeleteTenantReq = TRUE
    Admins <- FullAdmins
    Changes <- RaceChanges
    ChangeSub <- ChangeSubs
    ChangeKind <- ChangeKinds
    MaxRuns = 2
    InviteVersionCheck = TRUE
    ClaimTakesLock = TRUE
    LastManagerRule = TRUE
    ManagerTakesLock = TRUE
    FirstUserRule = TRUE
SPECIFICATION Spec
INVARIANTS
    OneLiveUserPerSub
    LiveUserInLiveTenant
    OneOutcomePerInvite
    ClaimedMeansOneUser
    RevokeBeatsClaim
    RunsBounded
    TenantKeepsAManager
PROPERTIES
    EveryRequestEnds
    PendingHasWayOut
