\* Finding F1, with no crash: the cleanup of a failed add can fail (its row check or its storage
\* delete), and then it keeps the object.
\* Expected: EveryObjectAccounted and NoObjectLeftInDeletedTenant break.
CONSTANTS
    Atts = {a1}
    Runners = {r1}
    MaxAttempts = 1
    MaxCrashes = 0
    CleanupFails = TRUE
    LateCommit = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK EveryObjectAccounted NoObjectLeftInDeletedTenant
