\* The liveness check: the bounds of MC.cfg with no user delete and MaxRuns 2, so the temporal check stays short.
CONSTANTS
    Claims <- FullClaims
    SubOf <- FullSub
    InvOf <- FullInv
    Invs <- FullInvs
    Revokes <- FullRevokes
    Initiators <- FullInitiators
    DeleteTenantReq = TRUE
    DeleteUserReq = FALSE
    MaxRuns = 2
    InviteVersionCheck = TRUE
    ClaimTakesLock = TRUE
SPECIFICATION Spec
INVARIANTS
    OneLiveUserPerSub
    LiveUserInLiveTenant
    OneOutcomePerInvite
    ClaimedMeansOneUser
    RevokeBeatsClaim
    RunsBounded
PROPERTIES
    EveryRequestEnds
    PendingHasWayOut
