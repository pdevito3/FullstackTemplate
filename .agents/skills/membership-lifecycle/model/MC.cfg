    SubOf <- FullSub
    InvOf <- FullInv
    Invs <- FullInvs
    Revokes <- FullRevokes
    Initiators <- FullInitiators
    DeleteTenantReq = TRUE
    Admins <- FullAdmins
    Changes <- FullChanges
    ChangeSub <- FullChangeSub
    ChangeKind <- FullChangeKind
    MaxRuns = 3
    InviteVersionCheck = TRUE
    ClaimTakesLock = TRUE
    LastAdminRule = TRUE
    AdminTakesLock = TRUE
SPECIFICATION Spec
INVARIANTS
    OneLiveUserPerSub
    LiveUserInLiveTenant
    OneOutcomePerInvite
    ClaimedMeansOneUser
    RevokeBeatsClaim
    RunsBounded
    TenantKeepsAnAdmin
